name: Deploy demo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: no-choice-demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: no-choice-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/no-choice/

      - name: Keep legacy asset aliases
        run: |
          cp dist/assets/index.js dist/assets/index-CJJyRTnw.js
          cp dist/assets/index.js dist/assets/index-Cbd5tPzE.js
          cp dist/assets/index.js dist/assets/index-Dq_CQboZ.js
          cp dist/assets/index.js dist/assets/index-vMOiIRKk.js
          cp dist/assets/index.js dist/assets/index-DZX14dDF.js
          cp dist/assets/index.css dist/assets/index-DHvZo4j5.css
          cp dist/assets/index.css dist/assets/index-Dcu7xTJ2.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: no-choice-demo/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
