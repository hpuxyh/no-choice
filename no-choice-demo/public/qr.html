<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫码体验不做选择</title>
    <style>
      :root {
        --ink: #1b1714;
        --paper: #fff8df;
        --card: #fffdf2;
        --yellow: #ffd84d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif;
      }

      main {
        width: min(92vw, 460px);
        padding: 28px;
        border: 4px solid var(--ink);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 8px 8px 0 var(--ink);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.55;
      }

      img {
        display: block;
        width: min(72vw, 320px);
        height: auto;
        margin: 24px auto 18px;
        border: 3px solid var(--ink);
        background: #fff;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--yellow);
        color: var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>扫码体验不做选择</h1>
      <p>手机扫码，直接进入抽卡拍板页面。</p>
      <img src="./no-choice-play-qr.png" alt="不做选择体验二维码" />
      <a href="https://no-choice.pages.dev/play.html">打开体验链接</a>
    </main>
  </body>
</html>
